<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunchGo</title>
    <link rel="stylesheet" href="./src/output.css">
    
</head>
<body class="bg-wheat">
<!-- 
    Encabezado principal del sitio web. Contiene la barra de navegación adaptativa 
    con enlaces y botón de menú móvil.
-->
<header class="sticky top-0">
    <!-- Navegación con color de fondo personalizado 'earth-yellow' -->
    <nav x-data="{ isOpen: false }" class="relative bg-earth-yellow shadow">
        <div class="container px-6 py-4 mx-auto md:flex md:justify-between md:items-center">
            
            <!-- Sección izquierda: logo y botón móvil -->
            <div class="flex items-center justify-between">
                <!-- Logotipo -->
                <a href="#">
                    <img class="w-auto h-6 sm:h-7" src="./media/img/Marca.webp" alt="Marca">
                </a>

                <!-- Botón menú (solo visible en pantallas pequeñas) -->
                <div class="flex lg:hidden">
                    <button x-cloak @click="isOpen = !isOpen" type="button"
                        class="text-white hover:text-gray-700 focus:outline-none focus:text-gray-700"
                        aria-label="Alternar menú">
                        <!-- Icono de menú (hamburguesa) -->
                        <svg x-show="!isOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8h16M4 16h16" />
                        </svg>

                        <!-- Icono de cierre (X) -->
                        <svg x-show="isOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Menú de navegación (visible según el tamaño de pantalla o estado de `isOpen`) -->
            <div x-cloak :class="[isOpen ? 'translate-x-0 opacity-100' : 'opacity-0 -translate-x-full']"
                class="absolute inset-x-0 z-20 w-full px-6 py-4 transition-all duration-300 ease-in-out bg-earth-yellow md:mt-0 md:p-0 md:top-0 md:relative md:bg-transparent md:w-auto md:opacity-100 md:translate-x-0 md:flex md:items-center">
                
                <!-- Enlaces de navegación -->
                <div class="flex flex-col md:flex-row md:mx-6">
                    <a class="my-2 text-gray-800 hover:text-white transition-colors duration-300 md:mx-4 md:my-0"
                        href="#">Inicio</a>
                    <a class="my-2 text-gray-800 hover:text-white transition-colors duration-300 md:mx-4 md:my-0"
                        href="#">Menú</a>
                    <a class="my-2 text-gray-800 hover:text-white transition-colors duration-300 md:mx-4 md:my-0"
                        href="#">Contacto</a>
                    <a class="my-2 text-gray-800 hover:text-white transition-colors duration-300 md:mx-4 md:my-0"
                        href="#">Nosotros</a>
                </div>

                <!-- Botón de carrito o acción adicional -->
                <div class="flex justify-center md:block">
                    <a class="relative text-gray-800 hover:text-white transition-colors duration-300"
                        href="#" aria-label="Carrito">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M3 3H5L5.4 5M7 13H17L21 5H5.4M7 13L5.4 5M7 13L4.707 15.293C4.077 15.923 4.523 17 5.414 17H17M17 17C15.895 17 15 17.895 15 19C15 20.105 15.895 21 17 21C18.105 21 19 20.105 19 19C19 17.895 18.105 17 17 17ZM9 19C9 20.105 8.105 21 7 21C5.895 21 5 20.105 5 19C5 17.895 5.895 17 7 17C8.105 17 9 17.895 9 19Z"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        <span class="absolute top-0 left-0 p-1 text-xs text-white bg-red-500 rounded-full"></span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>


    <footer>

    </footer>
</body>
</html>
