<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago - LunchGo</title>
    <link rel="stylesheet" href="./src/output.css">

    <link rel="shortcut icon" href="/media/img/logoTrans.webp" />
</head>

<body class="flex flex-col min-h-screen bg-wheat">
    <header class="sticky top-0">
        <nav x-data="{ isOpen: false }" class="relative bg-earth-yellow shadow">
            <div class="container px-6 py-4 mx-auto md:flex md:justify-between md:items-center">

                <div class="flex items-center justify-between">
                    <a href="./index.html">
                        <img class="w-auto h-6 sm:h-7" src="./media/img/Marca.webp" alt="Marca">
                    </a>

                    <div class="flex lg:hidden">
                        <button x-cloak @click="isOpen = !isOpen" type="button"
                            class="text-white hover:text-gray-700 focus:outline-none focus:text-gray-700"
                            aria-label="Alternar menú">
                            <svg x-show="!isOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 8h16M4 16h16" />
                            </svg>

                            <svg x-show="isOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div x-cloak :class="[isOpen ? 'translate-x-0 opacity-100' : 'opacity-0 -translate-x-full']"
                    class="absolute inset-x-0 z-20 w-full px-6 py-4 transition-all duration-300 ease-in-out bg-earth-yellow md:mt-0 md:p-0 md:top-0 md:relative md:bg-transparent md:w-auto md:opacity-100 md:translate-x-0 md:flex md:items-center">

                    <div class="flex flex-col md:flex-row md:mx-6">
                        <a class="my-2 text-gray-800 hover:text-white transition-colors duration-300 md:mx-4 md:my-0"
                            href="index.html">Inicio</a>
                        <a class="my-2 text-gray-800 hover:text-white transition-colors duration-300 md:mx-4 md:my-0"
                            href="menu.html">Menú</a>
                        <a class="my-2 text-gray-800 hover:text-white transition-colors duration-300 md:mx-4 md:my-0"
                            href="contacto.html">Contacto</a>
                        <a class="my-2 text-gray-800 hover:text-white transition-colors duration-300 md:mx-4 md:my-0"
                            href="nosotros.html">Nosotros</a>
                    </div>

                    <div x-data="{ openCart: false }" class="relative flex justify-center md:block">

                        <button @click="openCart = !openCart"
                            class="relative text-gray-800 hover:text-white transition-colors duration-300 focus:outline-none"
                            aria-label="Carrito">
                            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 3H5L5.4 5M7 13H17L21 5H5.4M7 13L5 17H17M17 17C15.895 17 15 17.895 15 19C15 20.105 15.895 21 17 21C18.105 21 19 20.105 19 19C19 17.895 18.105 17 17 17ZM7 17C5.895 17 5 17.895 5 19C5 20.105 5.895 21 7 21C8.105 21 9 20.105 9 19C9 17.895 8.105 17 7 17Z" />
                            </svg>

                            <span class="absolute top-0 left-0 bg-red-500 text-white text-xs rounded-full px-1">0</span>
                        </button>

                        <div x-show="openCart" @click.away="openCart = false" x-transition
                            class="absolute right-0 mt-2 w-64 bg-burnt-sienna rounded-lg shadow-lg z-50">
                            <div class="p-4">
                                <h3 class="font-semibold text-white">Tu carrito</h3>
                                <ul class="mt-2 space-y-2 text-sm text-white">
                                    <li id="MensajeCarrito" class="flex justify-center">
                                        Vacio!
                                    </li>
                                    <li id="TotalCarrito" class="flex justify-between">
                                        <span>Total</span><span>$0</span>
                                    </li>
                                </ul>
                                <div class="mt-4">
                                    <a href="#"
                                        class="block text-center bg-earth-yellow hover:bg-zomp text-white font-semibold py-2 rounded transition">
                                        Ir al pago
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Tu Carrito de Compras</h1>

        <div id="cart-items-container" class="bg-white shadow-md rounded-lg p-6 mb-8">
            <p class="text-gray-600">Cargando carrito...</p>
        </div>

        <div class="flex justify-end items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800 mr-4">Total: <span id="cart-total">$0.00</span></h2>
            <button
                class="px-6 py-3 bg-earth-yellow hover:bg-zomp text-gray-900 font-semibold rounded-lg shadow-md transition">
                Proceder al Pago
            </button>
        </div>

        <section class="bg-zomp shadow-md rounded-lg p-6">
            <h2 class="text-2xl font-bold text-white mb-4">Información de Envío y Pago</h2>
            <form>
                <div class="mb-4">
                    <label for="nombre" class="block text-white text-sm font-bold mb-2">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        required>
                </div>
                <div class="mb-4">
                    <label for="direccion" class="block text-white text-sm font-bold mb-2">Dirección:</label>
                    <input type="text" id="direccion" name="direccion"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        required>
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-white text-sm font-bold mb-2">Correo Electrónico:</label>
                    <input type="email" id="email" name="email"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        required>
                </div>
                <button type="submit"
                    class="px-6 py-3 bg-burnt-sienna hover:bg-red-700 text-white font-semibold rounded-lg shadow-md transition">
                    Confirmar Pedido
                </button>
            </form>
        </section>

    </main>


    <footer class="bg-burnt-sienna shadow-sm w-full px-4 md:px-8 py-6 text-white">
        <div class="max-w-screen-xl mx-auto">
            <div class="sm:flex sm:items-center sm:justify-between">
                <a href="index.html" class="flex items-center mb-4 sm:mb-0 space-x-3">
                    <img src="./media/img/logoTrans.webp" class="h-10" alt="LunchGo Logo" />
                    <span class="self-center text-2xl font-semibold whitespace-nowrap">LunchGo</span>
                </a>
                <ul class="flex flex-wrap items-center text-sm font-medium">
                    <li><a href="privacidad" class="hover:underline me-4 md:me-6">Privacidad</a></li>
                    <li><a href="licencia" class="hover:underline me-4 md:me-6">Licencia</a></li>
                </ul>
            </div>
            <hr class="my-6 border-white/40" />
            <span class="block text-sm text-center">© 2025 LunchGo™. Todos los derechos reservados.</span>
        </div>
    </footer>

    <script src="//unpkg.com/alpinejs" defer></script>
    <script src="pago.js"></script>

</body>

</html>
